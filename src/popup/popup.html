<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Kanalisa</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="k-page">
    <header class="k-row">
      <h1 data-i18n="statusTitle"></h1>
      <a href="../options/options.html" target="_blank" class="k-button k-button-quiet" data-i18n="openSettings"></a>
    </header>

    <div id="state" class="k-state" role="status" data-i18n="loading"></div>

    <dl class="k-list" id="stats">
      <div class="k-row">
        <dt data-i18n="statusTitle"></dt>
        <dd id="auth-status"></dd>
      </div>
      <div class="k-row">
        <dt data-i18n="aiCredits"></dt>
        <dd id="ai-credits"></dd>
      </div>
      <div class="k-row">
        <dt data-i18n="keywordQuota"></dt>
        <dd id="keyword-quota"></dd>
      </div>
    </dl>

    <form class="k-stack" id="search-form">
      <label class="k-label" for="search-input" data-i18n="keywordResearch"></label>
      <input class="k-field" id="search-input" type="search" required>
      <button class="k-button" type="submit" data-i18n="keywordResearch"></button>
    </form>
  </main>
  <script src="../utils/format.js"></script>
  <script src="../utils/cache.js"></script>
  <script src="../utils/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>

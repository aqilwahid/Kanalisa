<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanalisa</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="k-page">
    <h1 data-i18n="onboardingTitle"></h1>
    <div class="k-tabs" role="tablist" aria-label="Kanalisa">
      <button class="k-tab" type="button" role="tab" id="onboarding-tab" aria-controls="onboarding-panel" aria-selected="true" data-i18n="tabOnboarding"></button>
      <button class="k-tab" type="button" role="tab" id="settings-tab" aria-controls="settings-panel" aria-selected="false" tabindex="-1" data-i18n="tabSettings"></button>
    </div>

    <section id="onboarding-panel" role="tabpanel" aria-labelledby="onboarding-tab">
      <p class="k-state" data-i18n="onboardingIntro"></p>
      <form id="onboarding-form" novalidate>
        <fieldset class="k-step" data-step="1">
          <legend data-i18n="step1Title"></legend>
          <div class="k-choice-grid" id="niche-choices"></div>
          <p class="k-error" id="niche-error" role="alert" hidden></p>
          <button class="k-button" type="button" data-next data-i18n="nextStep"></button>
        </fieldset>
        <fieldset class="k-step" data-step="2" hidden>
          <legend data-i18n="step2Title"></legend>
          <label class="k-label" for="timezone"><span data-i18n="timezone"></span>
            <select class="k-field" id="timezone" name="timezone">
              <option value="Asia/Jakarta">WIB</option>
              <option value="Asia/Makassar">WITA</option>
              <option value="Asia/Jayapura">WIT</option>
            </select>
          </label>
          <label class="k-label" for="languageStyle"><span data-i18n="languageStyle"></span>
            <select class="k-field" id="languageStyle" name="languageStyle">
              <option value="formal" data-i18n="styleFormal"></option>
              <option value="casual" data-i18n="styleCasual"></option>
              <option value="lightClickbait" data-i18n="styleLightClickbait"></option>
              <option value="educational" data-i18n="styleEducational"></option>
            </select>
          </label>
          <div class="k-actions"><button class="k-button k-button-quiet" type="button" data-prev data-i18n="prevStep"></button><button class="k-button" type="button" data-next data-i18n="nextStep"></button></div>
        </fieldset>
        <fieldset class="k-step" data-step="3" hidden>
          <legend data-i18n="step3Title"></legend>
          <h2 data-i18n="reviewHeading"></h2>
          <dl id="review" class="k-list"></dl>
          <div class="k-actions"><button class="k-button k-button-quiet" type="button" data-prev data-i18n="prevStep"></button><button class="k-button" type="submit" data-i18n="finishOnboarding"></button></div>
        </fieldset>
      </form>
    </section>

    <section id="settings-panel" role="tabpanel" aria-labelledby="settings-tab" hidden>
      <form id="settings-form" class="k-stack">
        <fieldset><legend>Konfigurasi Backend API</legend>
          <label class="k-label" for="apiBaseUrl"><span>URL Server Backend</span>
            <input class="k-field" id="apiBaseUrl" type="url" placeholder="http://localhost:3000">
          </label>
          <p style="font-size: 0.85em; color: var(--k-muted); margin-top: 0.5em;">Kosongkan untuk otomatis (mode dev: http://localhost:3000, Web Store: https://api.kanalisa.id).</p>
        </fieldset>
        <fieldset><legend>Google OAuth Setup</legend>
          <label class="k-label" for="googleClientId"><span>Google Client ID</span>
            <input class="k-field" id="googleClientId" type="text" placeholder="Otomatis diambil dari server (atau isi manual)">
          </label>
          <p style="font-size: 0.85em; color: var(--k-muted); margin-top: 0.5em;">Dalam mode development/mock, login berfungsi langsung tanpa Client ID.</p>
        </fieldset>
        <fieldset><legend data-i18n="panelSettingsHeading"></legend>
          <label class="k-toggle"><input type="checkbox" id="videoPanelEnabled"><span data-i18n="featureVideoPanel"></span></label>
          <label class="k-toggle"><input type="checkbox" id="searchCardEnabled"><span data-i18n="featureSearchCard"></span></label>
        </fieldset>
        <fieldset><legend data-i18n="themeHeading"></legend>
          <label class="k-label" for="theme"><select class="k-field" id="theme"><option value="system" data-i18n="themeSystem"></option><option value="light" data-i18n="themeLight"></option><option value="dark" data-i18n="themeDark"></option></select></label>
        </fieldset>
        <button class="k-button" type="submit" data-i18n="saveSettings"></button>
      </form>
      <section class="k-danger"><h2 data-i18n="accountHeading"></h2><button class="k-button k-button-danger" type="button" id="delete-account" data-i18n="deleteAccount"></button></section>
    </section>
    <p class="k-status" id="status" role="status"></p>
  </main>
  <script src="../utils/api.js"></script>
  <script src="options.js"></script>
</body>
</html>
